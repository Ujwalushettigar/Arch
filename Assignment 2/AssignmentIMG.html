  <body>

    <script>
        const img = document.getElementById("images");

          let a = document.createElement("img");
          a.src = `https://via.assets.so/movie.png?id=${id}&q=95&w=360&h=360&fit=fill`;
          images.appendChild(a);
        }

    </script>
    </div>
